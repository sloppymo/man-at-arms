<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprehensive Man-at-Arms Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #1a1a1a; color: #fff; }
        .test-section { margin: 20px 0; padding: 15px; background: #2a2a2a; border-radius: 8px; }
        .test-result { margin: 8px 0; padding: 8px; border-radius: 4px; }
        .pass { background-color: #2d5a2d; color: #90ee90; }
        .fail { background-color: #5a2d2d; color: #ff9090; }
        .info { background-color: #2d4a5a; color: #90c0ff; }
        .warn { background-color: #5a5a2d; color: #ffff90; }
        #results { margin-top: 20px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; background: #444; color: #fff; border: none; border-radius: 4px; }
        button:hover { background: #555; }
        pre { background: #1a1a1a; padding: 10px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🎭 Man-at-Arms Comprehensive Integration Test</h1>
    
    <div>
        <button onclick="runAllTests()">🚀 Run All Tests</button>
        <button onclick="testStoryLoading()">📚 Test Story Loading</button>
        <button onclick="testCharacterCreation()">👤 Test Character Creation</button>
        <button onclick="testMainCampaign()">⚔️ Test Main Campaign</button>
        <button onclick="testTrainingScenarios()">🏋️ Test Training</button>
        <button onclick="clearResults()">🧹 Clear Results</button>
    </div>
    
    <div id="results"></div>
    
    <!-- Ink.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/inkjs@1.10.4/dist/ink.js"></script>
    
    <script>
        let testResults = [];
        
        function addResult(message, type = 'info', section = 'General') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = `<strong>[${section}]</strong> ${message}`;
            results.appendChild(div);
            
            testResults.push({ section, message, type, timestamp: new Date().toISOString() });
            results.scrollTop = results.scrollHeight;
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
            testResults = [];
        }
        
        async function loadStoryJson(storyName) {
            const response = await fetch(`js/ink/ink-stories/${storyName}.json`);
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }
            return await response.json();
        }
        
        async function testStoryLoading() {
            addResult('Starting story loading tests...', 'info', 'Story Loading');
            
            // Test Ink.js availability
            if (typeof window.inkjs !== 'undefined') {
                addResult('✅ Ink.js CDN loaded successfully', 'pass', 'Story Loading');
            } else {
                addResult('❌ Ink.js CDN failed to load', 'fail', 'Story Loading');
                return;
            }
            
            // Test each story file
            const stories = ['character-creation', 'main', 'training'];
            let allLoaded = true;
            
            for (const storyName of stories) {
                try {
                    addResult(`Loading ${storyName}.json...`, 'info', 'Story Loading');
                    
                    const storyJson = await loadStoryJson(storyName);
                    addResult(`✅ ${storyName}.json file loaded (${JSON.stringify(storyJson).length} bytes)`, 'pass', 'Story Loading');
                    
                    // Test Ink.js parsing
                    const story = new inkjs.Story(storyJson);
                    addResult(`✅ ${storyName} parsed by Ink.js successfully`, 'pass', 'Story Loading');
                    
                    // Test story structure
                    if (storyJson.inkVersion && storyJson.root) {
                        addResult(`✅ ${storyName} has valid Ink.js structure`, 'pass', 'Story Loading');
                    } else {
                        addResult(`❌ ${storyName} missing required Ink.js structure`, 'fail', 'Story Loading');
                        allLoaded = false;
                    }
                    
                } catch (error) {
                    addResult(`❌ ${storyName} failed: ${error.message}`, 'fail', 'Story Loading');
                    allLoaded = false;
                }
            }
            
            if (allLoaded) {
                addResult('🎉 All stories loaded and parsed successfully!', 'pass', 'Story Loading');
            } else {
                addResult('⚠️ Some stories failed to load', 'warn', 'Story Loading');
            }
        }
        
        async function testCharacterCreation() {
            addResult('Testing character creation flow...', 'info', 'Character Creation');
            
            try {
                const storyJson = await loadStoryJson('character-creation');
                const story = new inkjs.Story(storyJson);
                
                // Test story starts
                if (story.canContinue) {
                    const introText = story.Continue();
                    addResult(`✅ Story starts correctly: "${introText.substring(0, 100)}..."`, 'pass', 'Character Creation');
                } else {
                    addResult('❌ Story cannot continue from start', 'fail', 'Character Creation');
                    return;
                }
                
                // Test name selection
                if (story.currentChoices.length >= 3) {
                    addResult(`✅ Name selection has ${story.currentChoices.length} choices`, 'pass', 'Character Creation');
                    
                    // Choose first name
                    story.ChooseChoiceIndex(0);
                    if (story.canContinue) {
                        const nameText = story.Continue();
                        if (nameText.includes('William Thatcher')) {
                            addResult('✅ Name selection works correctly', 'pass', 'Character Creation');
                        } else {
                            addResult('❌ Name selection not working', 'fail', 'Character Creation');
                        }
                    }
                } else {
                    addResult(`❌ Name selection has only ${story.currentChoices.length} choices`, 'fail', 'Character Creation');
                }
                
                // Test age selection
                if (story.currentChoices.length >= 3) {
                    addResult(`✅ Age selection has ${story.currentChoices.length} choices`, 'pass', 'Character Creation');
                    
                    // Choose young age
                    story.ChooseChoiceIndex(0);
                    if (story.canContinue) {
                        const ageText = story.Continue();
                        if (ageText.includes('young')) {
                            addResult('✅ Age selection works correctly', 'pass', 'Character Creation');
                        } else {
                            addResult('❌ Age selection not working', 'fail', 'Character Creation');
                        }
                    }
                }
                
                // Test variable tracking
                const variables = story.variablesState;
                if (variables.characterName && variables.ageRange) {
                    addResult(`✅ Variables tracked: name=${variables.characterName}, age=${variables.ageRange}`, 'pass', 'Character Creation');
                } else {
                    addResult('❌ Variables not tracked properly', 'fail', 'Character Creation');
                }
                
            } catch (error) {
                addResult(`❌ Character creation test failed: ${error.message}`, 'fail', 'Character Creation');
            }
        }
        
        async function testMainCampaign() {
            addResult('Testing main campaign flow...', 'info', 'Main Campaign');
            
            try {
                const storyJson = await loadStoryJson('main');
                const story = new inkjs.Story(storyJson);
                
                // Test story starts
                if (story.canContinue) {
                    const introText = story.Continue();
                    addResult(`✅ Campaign starts: "${introText.substring(0, 100)}..."`, 'pass', 'Main Campaign');
                } else {
                    addResult('❌ Campaign cannot continue from start', 'fail', 'Main Campaign');
                    return;
                }
                
                // Test first chapter choices
                if (story.currentChoices.length >= 3) {
                    addResult(`✅ Chapter 1 has ${story.currentChoices.length} choices`, 'pass', 'Main Campaign');
                    
                    // Choose first option
                    story.ChooseChoiceIndex(0);
                    if (story.canContinue) {
                        const choiceText = story.Continue();
                        addResult(`✅ Choice consequence: "${choiceText.substring(0, 80)}..."`, 'pass', 'Main Campaign');
                    }
                } else {
                    addResult(`❌ Chapter 1 has only ${story.currentChoices.length} choices`, 'fail', 'Main Campaign');
                }
                
                // Test chapter progression
                const chapterCount = 0;
                let currentChapter = 1;
                
                // Navigate through a few more choices to test flow
                for (let i = 0; i < 3 && story.currentChoices.length > 0; i++) {
                    if (story.currentChoices.length > 0) {
                        story.ChooseChoiceIndex(0);
                        if (story.canContinue) {
                            story.Continue();
                        }
                    }
                }
                
                addResult(`✅ Campaign flow test completed`, 'pass', 'Main Campaign');
                
            } catch (error) {
                addResult(`❌ Main campaign test failed: ${error.message}`, 'fail', 'Main Campaign');
            }
        }
        
        async function testTrainingScenarios() {
            addResult('Testing training scenarios...', 'info', 'Training');
            
            try {
                const storyJson = await loadStoryJson('training');
                const story = new inkjs.Story(storyJson);
                
                // Test story starts
                if (story.canContinue) {
                    const introText = story.Continue();
                    addResult(`✅ Training starts: "${introText.substring(0, 100)}..."`, 'pass', 'Training');
                } else {
                    addResult('❌ Training cannot continue from start', 'fail', 'Training');
                    return;
                }
                
                // Test training options
                if (story.currentChoices.length >= 5) {
                    addResult(`✅ Training has ${story.currentChoices.length} options`, 'pass', 'Training');
                    
                    // Test sword training
                    story.ChooseChoiceIndex(0); // Sword training
                    if (story.canContinue) {
                        const swordText = story.Continue();
                        if (swordText.includes('sword')) {
                            addResult('✅ Sword training loads correctly', 'pass', 'Training');
                        } else {
                            addResult('❌ Sword training not working', 'fail', 'Training');
                        }
                    }
                    
                    // Test training choices
                    if (story.currentChoices.length >= 4) {
                        addResult(`✅ Sword training has ${story.currentChoices.length} exercises`, 'pass', 'Training');
                        
                        // Choose first exercise
                        story.ChooseChoiceIndex(0);
                        if (story.canContinue) {
                            const exerciseText = story.Continue();
                            if (exerciseText.includes('training_complete')) {
                                addResult('✅ Training exercise completes correctly', 'pass', 'Training');
                            } else {
                                addResult('❌ Training exercise not completing', 'fail', 'Training');
                            }
                        }
                    }
                } else {
                    addResult(`❌ Training has only ${story.currentChoices.length} options`, 'fail', 'Training');
                }
                
            } catch (error) {
                addResult(`❌ Training test failed: ${error.message}`, 'fail', 'Training');
            }
        }
        
        async function runAllTests() {
            clearResults();
            addResult('🚀 Starting comprehensive test suite...', 'info', 'General');
            
            await testStoryLoading();
            await new Promise(resolve => setTimeout(resolve, 500));
            
            await testCharacterCreation();
            await new Promise(resolve => setTimeout(resolve, 500));
            
            await testMainCampaign();
            await new Promise(resolve => setTimeout(resolve, 500));
            
            await testTrainingScenarios();
            
            // Summary
            const passed = testResults.filter(r => r.type === 'pass').length;
            const failed = testResults.filter(r => r.type === 'fail').length;
            const total = testResults.length;
            
            addResult(`📊 Test Summary: ${passed}/${total} passed, ${failed} failed`, 
                     failed === 0 ? 'pass' : 'warn', 'Summary');
            
            if (failed === 0) {
                addResult('🎉 All tests passed! The Ink.js integration is working perfectly!', 'pass', 'Summary');
            } else {
                addResult(`⚠️ ${failed} tests failed. Please check the issues above.`, 'warn', 'Summary');
            }
        }
        
        // Auto-run tests when page loads
        window.addEventListener('load', () => {
            setTimeout(runAllTests, 1000);
        });
    </script>
</body>
</html>
