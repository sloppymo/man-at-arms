<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Current Dialog State</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .debug { background: #f8f9fa; padding: 15px; border-radius: 5px; margin: 10px 0; }
        .error { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 5px; margin: 10px 0; }
        .success { background: #d4edda; color: #155724; padding: 10px; border-radius: 5px; margin: 10px 0; }
        button { margin: 5px; padding: 10px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🔍 Debug Current Dialog State</h1>
    
    <div class="debug">
        <h3>Testing Method Existence</h3>
        <button onclick="testMethodExistence()">Test What Methods Exist</button>
        <div id="method-results"></div>
    </div>
    
    <div class="debug">
        <h3>Testing Dialog Service</h3>
        <button onclick="testDialogService()">Test Dialog Service</button>
        <div id="service-results"></div>
    </div>
    
    <div class="debug">
        <h3>Testing Story Loading</h3>
        <button onclick="testStoryLoading()">Test Story Loading</button>
        <div id="story-results"></div>
    </div>

    <script type="module">
        // Import the actual dialogue service
        import { DialogueService, createDialogueService } from './src/systems/dialogue-service.js';
        
        // Mock dependencies
        const mockDispatcher = {
            listeners: {},
            subscribe(event, callback) {
                if (!this.listeners[event]) this.listeners[event] = [];
                this.listeners[event].push(callback);
            },
            dispatch(event, data, source) {
                console.log('Mock dispatch:', event, data, source);
            }
        };
        
        const mockGameState = {
            stats: { wealth: 100, reputation: 20 },
            overworld: { time: 600, supplies: { food: 5 } }
        };
        
        // Create service instance
        const dialogueService = createDialogueService(mockDispatcher, mockGameState, null);
        
        function testMethodExistence() {
            const resultsDiv = document.getElementById('method-results');
            const methods = [
                'initializeDialogSystem',
                'startDialogEncounter', 
                'initializeStories',
                'switchStory',
                'getCurrentStory',
                'getDialogSystemStatus'
            ];
            
            let html = '<h4>Method Existence Check:</h4>';
            methods.forEach(method => {
                const exists = typeof dialogueService[method] === 'function';
                const status = exists ? '✅ EXISTS' : '❌ MISSING';
                const className = exists ? 'success' : 'error';
                html += `<div class="${className}">${status} ${method}()</div>`;
            });
            
            resultsDiv.innerHTML = html;
        }
        
        async function testDialogService() {
            const resultsDiv = document.getElementById('service-results');
            let html = '<h4>Dialog Service Test:</h4>';
            
            try {
                // Test initializeDialogSystem (should fail - doesn't exist)
                if (typeof dialogueService.initializeDialogSystem === 'function') {
                    const result = await dialogueService.initializeDialogSystem();
                    html += `<div class="success">✅ initializeDialogSystem() returned: ${result}</div>`;
                } else {
                    html += `<div class="error">❌ initializeDialogSystem() method missing</div>`;
                }
                
                // Test initializeStories (should work - but is stubbed)
                if (typeof dialogueService.initializeStories === 'function') {
                    const result = await dialogueService.initializeStories();
                    html += `<div class="success">✅ initializeStories() returned: ${result}</div>`;
                } else {
                    html += `<div class="error">❌ initializeStories() method missing</div>`;
                }
                
                // Test service status
                if (typeof dialogueService.getDialogSystemStatus === 'function') {
                    const status = dialogueService.getDialogSystemStatus();
                    html += `<div class="success">✅ getDialogSystemStatus(): ${JSON.stringify(status)}</div>`;
                } else {
                    html += `<div class="error">❌ getDialogSystemStatus() method missing</div>`;
                }
                
            } catch (error) {
                html += `<div class="error">❌ Error testing dialog service: ${error.message}</div>`;
            }
            
            resultsDiv.innerHTML = html;
        }
        
        async function testStoryLoading() {
            const resultsDiv = document.getElementById('story-results');
            let html = '<h4>Story Loading Test:</h4>';
            
            try {
                // Try to initialize stories
                const initResult = await dialogueService.initializeStories();
                html += `<div>initializeStories() result: ${initResult}</div>`;
                
                // Check if stories were loaded
                const stories = dialogueService.stories || {};
                html += `<div>Stories loaded: ${Object.keys(stories).length}</div>`;
                html += `<div>Available stories: ${Object.keys(stories).join(', ')}</div>`;
                
                // Try to switch to forest story
                if (dialogueService.switchStory) {
                    const switchResult = dialogueService.switchStory('overworld/forest_test');
                    html += `<div>switchStory() result: ${switchResult}</div>`;
                    
                    // Check window.inkStory
                    if (window.inkStory) {
                        html += `<div class="success">✅ window.inkStory available</div>`;
                        
                        // Try to continue story
                        try {
                            const text = window.inkStory.Continue();
                            html += `<div class="success">✅ Story continues: "${text.trim()}"</div>`;
                        } catch (e) {
                            html += `<div class="error">❌ Story continue failed: ${e.message}</div>`;
                        }
                    } else {
                        html += `<div class="error">❌ window.inkStory not available</div>`;
                    }
                } else {
                    html += `<div class="error">❌ switchStory() method missing</div>`;
                }
                
            } catch (error) {
                html += `<div class="error">❌ Story loading error: ${error.message}</div>`;
            }
            
            resultsDiv.innerHTML = html;
        }
        
        // Make functions global
        window.testMethodExistence = testMethodExistence;
        window.testDialogService = testDialogService;
        window.testStoryLoading = testStoryLoading;
        
        // Initial test
        testMethodExistence();
    </script>
</body>
</html>
