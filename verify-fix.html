<!DOCTYPE html>
<html>
<head>
    <title>Verify Ink.js Fix</title>
</head>
<body>
    <h1>Verify Ink.js Fix</h1>
    <div id="output"></div>
    <button onclick="testStoryLoading()">Test Story Loading</button>
    
    <!-- Ink.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/inkjs@2.0.0/dist/ink.js"></script>
    
    <!-- Updated Story Loader -->
    <script src="js/ink/story-loader.js?t=1738898650"></script>
    
    <script>
        const output = document.getElementById('output');
        
        function log(message) {
            output.innerHTML += '<p>' + message + '</p>';
        }
        
        async function testStoryLoading() {
            log('=== Testing Story Loading ===');
            
            try {
                // Test the updated story loader
                if (typeof window.storyLoader !== 'undefined') {
                    log('✅ Story loader module loaded');
                    
                    // Try to load character creation story
                    log('Loading character-creation.ink...');
                    const story = await window.storyLoader.loadStory('character-creation');
                    
                    if (story) {
                        log('✅ Story loaded successfully!');
                        log('Story type: ' + typeof story);
                        log('Story methods: ' + Object.getOwnPropertyNames(Object.getPrototypeOf(story)).slice(0, 5).join(', '));
                        
                        // Test basic story functionality
                        if (typeof story.Continue === 'function') {
                            log('✅ Story.Continue method available');
                            
                            // Try to get some content
                            try {
                                const content = story.Continue();
                                log('✅ Got content: ' + content.substring(0, 50) + '...');
                            } catch (e) {
                                log('❌ Error getting content: ' + e.message);
                            }
                        } else {
                            log('❌ Story.Continue method not available');
                        }
                    } else {
                        log('❌ Story loading returned null/undefined');
                    }
                } else {
                    log('❌ Story loader module not available');
                }
                
            } catch (error) {
                log('❌ Error: ' + error.message);
                log('Stack: ' + error.stack);
            }
            
            log('=== Test Complete ===');
        }
        
        // Auto-run test when page loads
        window.addEventListener('load', () => {
            setTimeout(testStoryLoading, 1000);
        });
    </script>
</body>
</html>
