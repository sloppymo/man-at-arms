<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Loading Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .pass { background-color: #d4edda; color: #155724; }
        .fail { background-color: #f8d7da; color: #721c24; }
        .info { background-color: #d1ecf1; color: #0c5460; }
        #results { margin-top: 20px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Ink.js Story Loading Test</h1>
    
    <div>
        <button onclick="testStoryLoading()">Test All Stories</button>
        <button onclick="clearResults()">Clear Results</button>
    </div>
    
    <div id="results"></div>
    
    <!-- Ink.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/inkjs@1.10.4/dist/ink.js"></script>
    
    <script>
        function addResult(message, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = message;
            results.appendChild(div);
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }
        
        async function testStoryLoading() {
            addResult('Starting story loading tests...', 'info');
            
            // Test 1: Ink.js loaded
            if (typeof window.inkjs !== 'undefined') {
                addResult('✅ Ink.js CDN loaded successfully', 'pass');
            } else {
                addResult('❌ Ink.js CDN failed to load', 'fail');
                return;
            }
            
            // Test 2-4: Load each story
            const stories = ['character-creation', 'main', 'training'];
            
            for (const storyName of stories) {
                try {
                    addResult(`Testing ${storyName}.json...`, 'info');
                    
                    // Load the JSON file
                    const response = await fetch(`js/ink/ink-stories/${storyName}.json`);
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    
                    const storyJson = await response.json();
                    addResult(`✅ ${storyName}.json loaded successfully`, 'pass');
                    
                    // Test Ink.js parsing
                    try {
                        const story = new inkjs.Story(storyJson);
                        addResult(`✅ ${storyName} parsed by Ink.js successfully`, 'pass');
                        
                        // Test basic story functionality
                        if (story.canContinue) {
                            const text = story.Continue();
                            addResult(`✅ ${storyName} can continue and generated text: "${text.substring(0, 50)}..."`, 'pass');
                        } else {
                            addResult(`⚠️ ${storyName} cannot continue (may be at choice or end)`, 'info');
                        }
                        
                        // Check for choices if available
                        if (story.currentChoices.length > 0) {
                            addResult(`✅ ${storyName} has ${story.currentChoices.length} choices available`, 'pass');
                        }
                        
                    } catch (inkError) {
                        addResult(`❌ ${storyName} failed to parse with Ink.js: ${inkError.message}`, 'fail');
                        console.error(`Ink.js parsing error for ${storyName}:`, inkError);
                    }
                    
                } catch (error) {
                    addResult(`❌ ${storyName}.json failed to load: ${error.message}`, 'fail');
                    console.error(`Loading error for ${storyName}:`, error);
                }
            }
            
            addResult('Story loading tests complete!', 'info');
        }
        
        // Auto-run tests when page loads
        window.addEventListener('load', () => {
            setTimeout(testStoryLoading, 500);
        });
    </script>
</body>
</html>
