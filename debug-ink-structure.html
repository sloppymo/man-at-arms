<!DOCTYPE html>
<html>
<head>
    <title>Debug Ink.js Structure</title>
</head>
<body>
    <h1>Debug Ink.js Structure</h1>
    <div id="output"></div>
    
    <!-- Try different Ink.js versions -->
    <script src="https://cdn.jsdelivr.net/npm/inkjs@1.10.4/dist/ink.js"></script>
    <script>
        const output = document.getElementById('output');
        
        function log(message) {
            output.innerHTML += '<p>' + message + '</p>';
        }
        
        function debugInk() {
            log('=== Debugging Ink.js Structure ===');
            log('typeof inkjs: ' + typeof inkjs);
            
            if (inkjs) {
                log('inkjs object: ' + JSON.stringify(inkjs, null, 2));
                log('inkjs keys: ' + Object.keys(inkjs).join(', '));
                
                // Check for Compiler
                log('inkjs.Compiler: ' + typeof inkjs.Compiler);
                if (inkjs.Compiler) {
                    log('Compiler methods: ' + Object.getOwnPropertyNames(inkjs.Compiler).join(', '));
                }
                
                // Check Story constructor
                log('inkjs.Story: ' + typeof inkjs.Story);
                if (inkjs.Story) {
                    log('Story prototype methods: ' + Object.getOwnPropertyNames(Object.getPrototypeOf(inkjs.Story.prototype)).join(', '));
                }
                
                // Try to find any compile function
                for (let key in inkjs) {
                    const obj = inkjs[key];
                    if (typeof obj === 'object' && obj !== null) {
                        if (typeof obj.compile === 'function') {
                            log('Found compile function in inkjs.' + key);
                        }
                    }
                }
                
                // Test what Story constructor accepts
                try {
                    log('Testing Story constructor with different inputs...');
                    
                    // Test 1: Raw ink
                    try {
                        const rawInk = '=== test ===\nHello!';
                        const story1 = new inkjs.Story(rawInk);
                        log('✅ Story accepts raw ink: ' + story1.Continue());
                    } catch (e1) {
                        log('❌ Story rejects raw ink: ' + e1.message);
                    }
                    
                    // Test 2: Simple JSON
                    try {
                        const simpleJson = '{"test": "Hello"}';
                        const story2 = new inkjs.Story(simpleJson);
                        log('✅ Story accepts JSON: ' + story2.Continue());
                    } catch (e2) {
                        log('❌ Story rejects JSON: ' + e2.message);
                    }
                    
                } catch (e) {
                    log('Error testing Story constructor: ' + e.message);
                }
            }
            
            log('=== Debug Complete ===');
        }
        
        // Auto-run debug
        setTimeout(debugInk, 1000);
    </script>
</body>
</html>
