<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#1a0f08"/>
  
  <!-- Character silhouette - Bandit Leader -->
  <g transform="translate(200, 200)">
    <!-- Head -->
    <circle cx="0" cy="-50" r="40" fill="#8b7355" stroke="#654321" stroke-width="2"/>
    
    <!-- Eyes -->
    <circle cx="-12" cy="-55" r="3" fill="#000"/>
    <circle cx="12" cy="-55" r="3" fill="#000"/>
    
    <!-- Scar across eye -->
    <path d="M -20,-50 L 20,-45" stroke="#8b0000" stroke-width="2"/>
    
    <!-- Nose -->
    <path d="M 0,-45 L -3,-40 L 3,-40 Z" fill="#a0826d"/>
    
    <!-- Mouth - sneer -->
    <path d="M -15,-35 Q 0,-40 15,-35" stroke="#000" stroke-width="2" fill="none"/>
    
    <!-- Stubble -->
    <circle cx="-15" cy="-30" r="1" fill="#4a4a4a"/>
    <circle cx="-5" cy="-28" r="1" fill="#4a4a4a"/>
    <circle cx="5" cy="-28" r="1" fill="#4a4a4a"/>
    <circle cx="15" cy="-30" r="1" fill="#4a4a4a"/>
    
    <!-- Hood -->
    <path d="M -45,-80 Q 0,-95 45,-80 L 40,-60 L -40,-60 Z" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="2"/>
    
    <!-- Body -->
    <rect x="-40" y="0" width="80" height="100" fill="#4a4a4a" stroke="#2a2a2a" stroke-width="2"/>
    
    <!-- Leather armor -->
    <rect x="-35" y="10" width="70" height="80" fill="#654321" stroke="#4a3018" stroke-width="2"/>
    
    <!-- Dagger -->
    <rect x="35" y="20" width="4" height="30" fill="#c0c0c0" stroke="#808080" stroke-width="1"/>
    <rect x="33" y="15" width="8" height="8" fill="#8b4513"/>
    
    <!-- Shoulders (intimidating) -->
    <circle cx="-45" cy="10" r="15" fill="#654321"/>
    <circle cx="45" cy="10" r="15" fill="#654321"/>
  </g>
  
  <!-- Frame -->
  <rect x="10" y="10" width="380" height="380" fill="none" stroke="#8b0000" stroke-width="4"/>
</svg>
