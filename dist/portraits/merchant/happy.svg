<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#2a1810"/>
  
  <!-- Character silhouette - Merchant (Happy) -->
  <g transform="translate(200, 200)">
    <!-- Head -->
    <circle cx="0" cy="-50" r="40" fill="#d4a574" stroke="#8b4513" stroke-width="2"/>
    
    <!-- Eyes (crinkled) -->
    <path d="M -15,-58 Q -12,-55 -9,-58" stroke="#000" stroke-width="2" fill="none"/>
    <path d="M 9,-58 Q 12,-55 15,-58" stroke="#000" stroke-width="2" fill="none"/>
    
    <!-- Nose -->
    <path d="M 0,-45 L -3,-40 L 3,-40 Z" fill="#c19660"/>
    
    <!-- Mouth - smiling -->
    <path d="M -20,-35 Q 0,-25 20,-35" stroke="#000" stroke-width="2" fill="#ff6b6b"/>
    
    <!-- Beard -->
    <path d="M -25,-25 Q -20,-10 0,-5 Q 20,-10 25,-25" fill="#8b6914"/>
    
    <!-- Hat -->
    <ellipse cx="0" cy="-75" rx="45" ry="15" fill="#654321"/>
    <rect x="-30" y="-90" width="60" height="20" fill="#654321"/>
    
    <!-- Body -->
    <rect x="-40" y="0" width="80" height="100" fill="#8b4513" stroke="#654321" stroke-width="2"/>
    
    <!-- Vest -->
    <rect x="-35" y="10" width="70" height="80" fill="#d4af37" stroke="#b8941f" stroke-width="2"/>
    
    <!-- Money pouch (bouncing) -->
    <circle cx="25" cy="35" r="15" fill="#ffd700" stroke="#b8860b" stroke-width="2"/>
    
    <!-- Sparkles around money pouch -->
    <circle cx="45" cy="30" r="2" fill="#ffd700"/>
    <circle cx="40" cy="45" r="2" fill="#ffd700"/>
    <circle cx="50" cy="40" r="2" fill="#ffd700"/>
  </g>
  
  <!-- Frame -->
  <rect x="10" y="10" width="380" height="380" fill="none" stroke="#d4af37" stroke-width="4"/>
</svg>
