<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <radialGradient id="skyGradient" cx="50%" cy="30%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="landGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#228B22;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#32CD32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#006400;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Sky background -->
  <rect width="800" height="300" fill="url(#skyGradient)" />

  <!-- Land/terrain -->
  <rect y="300" width="800" height="300" fill="url(#landGradient)" />

  <!-- Rivers (simplified) -->
  <path d="M 200 350 Q 250 320 300 350 Q 350 380 400 350 Q 450 320 500 350 L 500 600 L 200 600 Z"
        fill="#4682B4" opacity="0.7" />

  <!-- Roads (simplified) -->
  <path d="M 50 400 L 150 380 L 200 420 L 300 400 L 400 380 L 500 420 L 600 400"
        stroke="#8B4513" stroke-width="4" fill="none" />

  <!-- Cities/settlements (represented as simple shapes) -->
  <!-- Portsmouth -->
  <circle cx="50" cy="400" r="8" fill="#DAA520" stroke="#B8860B" stroke-width="2" />
  <text x="50" y="405" text-anchor="middle" font-size="10" fill="#000">Portsmouth</text>

  <!-- Calais -->
  <circle cx="100" cy="450" r="10" fill="#DAA520" stroke="#B8860B" stroke-width="2" />
  <text x="100" y="455" text-anchor="middle" font-size="10" fill="#000">Calais</text>

  <!-- Crécy -->
  <circle cx="150" cy="430" r="8" fill="#DC143C" stroke="#B22222" stroke-width="2" />
  <text x="150" y="435" text-anchor="middle" font-size="10" fill="#000">Crécy</text>

  <!-- Caen -->
  <circle cx="120" cy="410" r="8" fill="#DAA520" stroke="#B8860B" stroke-width="2" />
  <text x="120" y="415" text-anchor="middle" font-size="10" fill="#000">Caen</text>

  <!-- Rouen -->
  <circle cx="140" cy="390" r="8" fill="#DAA520" stroke="#B8860B" stroke-width="2" />
  <text x="140" y="395" text-anchor="middle" font-size="10" fill="#000">Rouen</text>

  <!-- Tours -->
  <circle cx="200" cy="470" r="8" fill="#DAA520" stroke="#B8860B" stroke-width="2" />
  <text x="200" y="475" text-anchor="middle" font-size="10" fill="#000">Tours</text>

  <!-- Poitiers -->
  <circle cx="220" cy="490" r="8" fill="#DC143C" stroke="#B22222" stroke-width="2" />
  <text x="220" y="495" text-anchor="middle" font-size="10" fill="#000">Poitiers</text>

  <!-- Title overlay -->
  <text x="400" y="30" text-anchor="middle" font-size="24" font-weight="bold" fill="#2F4F4F">
    France 1346-1347
  </text>
  <text x="400" y="55" text-anchor="middle" font-size="16" fill="#696969">
    Hundred Years' War Campaign Map
  </text>

  <!-- Legend -->
  <rect x="600" y="20" width="180" height="120" fill="#F5F5F5" stroke="#000" stroke-width="1" opacity="0.9" />
  <text x="610" y="40" font-size="12" font-weight="bold" fill="#000">Legend:</text>
  <circle cx="620" cy="60" r="5" fill="#DAA520" />
  <text x="635" y="65" font-size="10" fill="#000">Cities</text>
  <circle cx="620" cy="80" r="5" fill="#DC143C" />
  <text x="635" y="85" font-size="10" fill="#000">Battles</text>
  <rect x="615" y="90" width="10" height="3" fill="#4682B4" />
  <text x="635" y="95" font-size="10" fill="#000">Rivers</text>
  <rect x="615" y="105" width="10" height="2" fill="#8B4513" />
  <text x="635" y="110" font-size="10" fill="#000">Roads</text>
</svg>
