<!DOCTYPE html>
<html>
<head>
    <title>Fresh Ink.js Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .pass { background: #d4edda; color: #155724; }
        .fail { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        button { padding: 10px 20px; margin: 5px; }
    </style>
</head>
<body>
    <h1>Fresh Ink.js Test - No Cache</h1>
    <button onclick="runTest()">Run Test</button>
    <div id="results"></div>
    
    <!-- Ink.js CDN - Try different version that supports raw ink -->
    <script src="https://unpkg.com/inkjs@2.1.0/dist/ink.js"></script>
    
    <script>
        const results = document.getElementById('results');
        
        function addResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.textContent = message;
            results.appendChild(div);
        }
        
        async function runTest() {
            results.innerHTML = '';
            addResult('Starting fresh test...', 'info');
            
            // Test 1: Check Ink.js
            if (typeof inkjs !== 'undefined') {
                addResult('✅ Ink.js loaded', 'pass');
                
                // Debug: Show what's available
                addResult('Available keys: ' + Object.keys(inkjs).slice(0, 10).join(', '), 'info');
                addResult('Has Compiler: ' + (inkjs.Compiler ? 'YES' : 'NO'), 'info');
                
            } else {
                addResult('❌ Ink.js not loaded', 'fail');
                return;
            }
            
            // Test 2: Check Story class
            if (typeof inkjs.Story !== 'undefined') {
                addResult('✅ Story class available', 'pass');
            } else {
                addResult('❌ Story class not available', 'fail');
                return;
            }
            
            // Test 3: Try different story creation methods
            const testInk = `Hello world.
This is a simple test.
No complex ink syntax here.`;
            
            // Method 1: Try raw ink (simplified)
            try {
                const story1 = new inkjs.Story(testInk);
                addResult('✅ Simple raw ink works: ' + story1.Continue(), 'pass');
                return; // Success! Exit early
            } catch (e1) {
                addResult('❌ Simple raw ink failed: ' + e1.message, 'fail');
            }
            
            // Method 2: Try compiler
            try {
                if (inkjs.Compiler) {
                    const compiled = inkjs.Compiler.compile(testInk);
                    const story2 = new inkjs.Story(compiled.toJson());
                    addResult('✅ Compiler method works: ' + story2.Continue(), 'pass');
                    return; // Success! Exit early
                } else {
                    addResult('❌ No compiler available', 'fail');
                }
            } catch (e2) {
                addResult('❌ Compiler failed: ' + e2.message, 'fail');
            }
            
            // Method 3: Try global compiler
            try {
                if (typeof Compiler !== 'undefined') {
                    const compiled = Compiler.compile(testInk);
                    const story3 = new inkjs.Story(compiled.toJson());
                    addResult('✅ Global compiler works: ' + story3.Continue(), 'pass');
                    return; // Success! Exit early
                } else {
                    addResult('❌ No global compiler', 'fail');
                }
            } catch (e3) {
                addResult('❌ Global compiler failed: ' + e3.message, 'fail');
            }
            
            // Test 6: Load actual story file (try working JSON)
            try {
                addResult('Loading character-creation.json as working JSON...', 'info');
                const response = await fetch('js/ink/ink-stories/character-creation.json?t=' + Date.now());
                const jsonContent = await response.text();
                
                addResult('JSON preview: ' + jsonContent.substring(0, 100) + '...', 'info');
                
                // Try parsing and creating story
                const parsedJson = JSON.parse(jsonContent);
                addResult('✅ JSON parsed successfully', 'pass');
                
                const charStory = new inkjs.Story(parsedJson);
                addResult('✅ Story created from JSON', 'pass');
                
                // Set up error handler
                charStory.onError = (error) => {
                    console.log('Ink error:', error);
                };
                
                const charContent = charStory.Continue();
                addResult('✅ Content: ' + charContent.substring(0, 50) + '...', 'pass');
                addResult('✅ Can continue: ' + charStory.canContinue, 'pass');
                addResult('✅ Choices available: ' + charStory.currentChoices.length, 'pass');
                
                if (charStory.currentChoices.length > 0) {
                    addResult('✅ First choice: ' + charStory.currentChoices[0].text, 'pass');
                }
                
                addResult('🎉 WORKING JSON WITH CONTENT SUCCESS!', 'pass');
                
            } catch (storyError) {
                addResult('❌ Failed to load working JSON: ' + storyError.message, 'fail');
            }
            
            addResult('❌ All methods failed', 'fail');
        }
        
        // Auto-run after 1 second
        setTimeout(runTest, 1000);
    </script>
</body>
</html>
