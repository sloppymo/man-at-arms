<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ink.js Debug</title>
</head>
<body>
    <h1>Ink.js Debug Information</h1>
    <div id="debug-info"></div>
    
    <!-- Ink.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/inkjs@1.10.4/dist/ink.js"></script>
    
    <script>
        const debugInfo = document.getElementById('debug-info');
        
        function addInfo(text) {
            debugInfo.innerHTML += '<p>' + text + '</p>';
        }
        
        addInfo('Ink.js Debug Information:');
        addInfo('typeof inkjs: ' + typeof inkjs);
        addInfo('inkjs object: ' + JSON.stringify(Object.keys(inkjs || {}), null, 2));
        
        if (inkjs) {
            addInfo('inkjs.Story: ' + typeof inkjs.Story);
            addInfo('inkjs.Compiler: ' + typeof inkjs.Compiler);
            
            if (inkjs.Story) {
                addInfo('Story constructor available');
                try {
                    const testStory = new inkjs.Story('=== test ===\nHello world!\n* [Continue] -> DONE');
                    addInfo('✅ Story creation works');
                    addInfo('Story methods: ' + Object.getOwnPropertyNames(Object.getPrototypeOf(testStory)).join(', '));
                } catch (e) {
                    addInfo('❌ Story creation failed: ' + e.message);
                }
            }
        }
    </script>
</body>
</html>
