<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Man-at-Arms Game</title>
<style>
body{background:#1a1a1a;color:#fff;font-family:Arial;margin:0;padding:20px}
.container{max-width:800px;margin:0 auto}
.header{text-align:center;margin-bottom:30px}
.button{background:#4CAF50;color:white;border:none;padding:15px 25px;margin:10px;cursor:pointer;border-radius:5px;font-size:16px}
.button:hover{background:#45a049}
.button:disabled{background:#666;cursor:not-allowed}
.status{background:rgba(0,0,0,0.3);padding:15px;margin:10px 0;border-radius:5px}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>🏰 Man-at-Arms Quest</h1>
<p>Medieval Adventure Game</p>
</div>

<div class="status">
<div>📍 Location: <strong id="location">Town Square</strong></div>
<div>📜 Quest: <strong id="quest">Not Started</strong></div>
<div>🎒 Inventory: <strong id="inventory">Empty</strong></div>
</div>

<div style="margin:20px 0;">
<button class="button" onclick="startQuest()">Start Quest</button>
<button class="button" onclick="goToCastle()">Go to Castle</button>
<button class="button" onclick="deliverMessage()">Deliver Message</button>
<button class="button" onclick="completeQuest()">Complete Quest</button>
<button class="button" onclick="resetGame()">Reset Game</button>
</div>

<div id="message" style="background:rgba(255,255,255,0.1);padding:15px;margin:20px 0;border-radius:5px;">
Click "Start Quest" to begin your adventure!
</div>
</div>

<script>
let location='Town Square';
let quest='Not Started';
let inventory=[];
let hasScroll=false;

function updateDisplay(){
document.getElementById('location').textContent=location;
document.getElementById('quest').textContent=quest;
document.getElementById('inventory').textContent=inventory.length>0?inventory.join(', '):'Empty';
}

function startQuest(){
if(quest==='Not Started'){
quest='Quest Accepted';
inventory.push('Message Scroll');
hasScroll=true;
updateDisplay();
document.getElementById('message').innerHTML='✅ Quest started! You received a message scroll. Deliver it to the castle gate.';
}
}

function goToCastle(){
location='Castle Gate';
updateDisplay();
document.getElementById('message').innerHTML='🏰 You arrived at the castle gate. The guard is waiting.';
}

function deliverMessage(){
if(hasScroll&&location==='Castle Gate'){
quest='Message Delivered';
inventory=[];
hasScroll=false;
updateDisplay();
document.getElementById('message').innerHTML='📜 Message delivered successfully! Return to the merchant for your reward.';
}else{
document.getElementById('message').innerHTML='❌ You need to be at the castle gate with the message scroll!';
}
}

function completeQuest(){
if(quest==='Message Delivered'){
quest='Quest Complete';
inventory.push('5 silver pieces','reputation +1');
updateDisplay();
document.getElementById('message').innerHTML='🎉 Quest complete! You received your reward!';
}else{
document.getElementById('message').innerHTML='❌ You need to deliver the message first!';
}
}

function resetGame(){
location='Town Square';
quest='Not Started';
inventory=[];
hasScroll=false;
updateDisplay();
document.getElementById('message').innerHTML='Click "Start Quest" to begin your adventure!';
}

updateDisplay();
</script>
</body>
</html>
