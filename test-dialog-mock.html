<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Dialog System Test</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            background: #f0f0f0;
        }
        .container { 
            max-width: 800px; 
            margin: 0 auto; 
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .dialog-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .dialog-content {
            display: flex;
            padding: 20px;
            min-height: 300px;
        }
        .portrait-container {
            width: 150px;
            margin-right: 20px;
        }
        .portrait {
            width: 120px;
            height: 120px;
            border: 3px solid #ddd;
            border-radius: 10px;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #666;
        }
        .text-container {
            flex: 1;
        }
        .character-name {
            font-weight: bold;
            font-size: 18px;
            color: #333;
            margin-bottom: 10px;
        }
        .dialog-text {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .choices {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .choice-button { 
            padding: 12px 20px; 
            background: #667eea; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .choice-button:hover { 
            background: #5a6fd8; 
            transform: translateX(5px);
        }
        .status {
            background: #e9ecef;
            padding: 10px;
            text-align: center;
            font-weight: bold;
        }
        .debug { 
            background: #333; 
            color: white; 
            padding: 10px; 
            border-radius: 5px; 
            margin: 10px 0;
            font-family: monospace;
            font-size: 12px;
            max-height: 150px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="dialog-header">
            <h1>🎭 Mock Dialog System Test</h1>
            <p>Testing dialog functionality without Ink.js</p>
        </div>
        
        <div class="status" id="status">Ready to test dialog system...</div>
        
        <div class="dialog-content">
            <div class="portrait-container">
                <div class="portrait" id="portrait">No Portrait</div>
            </div>
            <div class="text-container">
                <div class="character-name" id="character-name">Character Name</div>
                <div class="dialog-text" id="dialog-text">Dialog text will appear here...</div>
                <div class="choices" id="choices"></div>
            </div>
        </div>
        
        <div style="padding: 20px; text-align: center;">
            <button onclick="testMerchantDialog()" style="margin: 5px; padding: 10px 20px;">Test Merchant Dialog</button>
            <button onclick="testForestStory()" style="margin: 5px; padding: 10px 20px;">Test Forest Story</button>
            <button onclick="testBanditDialog()" style="margin: 5px; padding: 10px 20px;">Test Bandit Dialog</button>
            <button onclick="testNoblesDialog()" style="margin: 5px; padding: 10px 20px;">Test Nobles Dialog</button>
            <button onclick="testPeasantsDialog()" style="margin: 5px; padding: 10px 20px;">Test Peasants Dialog</button>
            <button onclick="clearDialog()" style="margin: 5px; padding: 10px 20px;">Clear Dialog</button>
        </div>
        
        <div class="debug" id="debug">Debug information will appear here...</div>
    </div>

    <script>
        let currentStory = null;
        let testResults = { portraitsLoaded: 0, portraitsFailed: 0, errors: [] };
        
        function updateStatus(message) {
            document.getElementById('status').innerHTML = message;
            console.log('Status:', message);
        }
        
        function updateDebug(message) {
            const debug = document.getElementById('debug');
            debug.innerHTML += '<br>' + message;
            console.log('Debug:', message);
        }
        
        function showDialog(characterName, emotion, text, choices) {
            document.getElementById('character-name').textContent = characterName;
            document.getElementById('dialog-text').textContent = text;
            
            // Update portrait with actual image
            const portrait = document.getElementById('portrait');
            const characterData = {
                'Merchant': 'public/portraits/merchant/neutral.svg',
                'Sir James': 'public/portraits/james/james.png',
                'Sir David': 'public/portraits/david/david.png',
                'Baron Caley': 'public/portraits/baroncaley/baroncaley.png',
                'Count Charles': 'public/portraits/charles/charles.png',
                'Local Peasant': 'public/portraits/granny/granny.png',
                'Bandit Leader': 'public/portraits/bandit_leader/neutral.svg'
            };
            
            const portraitPath = characterData[characterName] || 'portraits/merchant/neutral.svg';
            portrait.innerHTML = `<img src="${portraitPath}" alt="${characterName}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 7px;">`;
            
            const choicesContainer = document.getElementById('choices');
            choicesContainer.innerHTML = '';
            
            if (choices && choices.length > 0) {
                choices.forEach((choice, index) => {
                    const button = document.createElement('button');
                    button.className = 'choice-button';
                    button.textContent = choice.text;
                    button.onclick = () => {
                        updateDebug('Choice selected: ' + choice.text);
                        if (choice.action) {
                            choice.action();
                        }
                    };
                    choicesContainer.appendChild(button);
                });
            }
            
            updateStatus(`Showing dialog: ${characterName}`);
        }
        
        function clearDialog() {
            document.getElementById('character-name').textContent = 'Character Name';
            document.getElementById('dialog-text').textContent = 'Dialog text will appear here...';
            document.getElementById('portrait').textContent = 'No Portrait';
            document.getElementById('choices').innerHTML = '';
            updateStatus('Dialog cleared');
        }
        
        function testMerchantDialog() {
            updateDebug('Testing merchant dialog...');
            showDialog('Merchant', 'neutral', 'Welcome, traveler! I have some fine wares for sale today. What interests you?', [
                {
                    text: 'Show me your weapons',
                    action: () => showDialog('Merchant', 'happy', 'I have this fine steel sword for 50 gold coins. It\'s well-crafted and battle-tested.', [
                        {
                            text: 'I\'ll take it!',
                            action: () => showDialog('Merchant', 'happy', 'Excellent choice! Here\'s your sword. May it serve you well in your adventures.', [])
                        },
                        {
                            text: 'Too expensive for me',
                            action: () => showDialog('Merchant', 'neutral', 'Perhaps something else then? I also have healing potions for 10 gold each.', [])
                        }
                    ])
                },
                {
                    text: 'What about armor?',
                    action: () => showDialog('Merchant', 'neutral', 'I have leather armor for 30 gold and chain mail for 80 gold. Both offer good protection.', [])
                },
                {
                    text: 'Just browsing',
                    action: () => showDialog('Merchant', 'neutral', 'Of course, take your time. Let me know if you need anything.', [])
                }
            ]);
        }
        
        function testForestStory() {
            updateDebug('Testing forest story...');
            showDialog('Sir James', 'neutral', 'You venture into the dense forest. The trees tower above you, and the path ahead is uncertain.', [
                {
                    text: 'Continue deeper into the forest',
                    action: () => showDialog('Sir James', 'neutral', 'You push forward through the thick undergrowth. The forest grows darker and more mysterious. You hear strange sounds in the distance.', [
                        {
                            text: 'Investigate the sounds',
                            action: () => showDialog('Sir David', 'neutral', 'You discover a small clearing with a crystal spring. The water looks pure and refreshing.', [])
                        },
                        {
                            text: 'Turn back',
                            action: () => showDialog('Sir James', 'neutral', 'You decide this forest is too dangerous. Sometimes discretion is the better part of valor.', [])
                        }
                    ])
                },
                {
                    text: 'Follow the stream',
                    action: () => showDialog('Sir David', 'neutral', 'You discover a small crystal stream. The water looks pure and refreshing. This could be valuable.', [])
                },
                {
                    text: 'Turn back',
                    action: () => showDialog('Sir James', 'neutral', 'You decide to leave the forest. There will be other opportunities for adventure.', [])
                }
            ]);
        }
        
        function testBanditDialog() {
            updateDebug('Testing bandit dialog...');
            showDialog('Bandit Leader', 'cruel', 'Well, well... what do we have here? A lone traveler in our forest?', [
                {
                    text: 'I\'m just passing through',
                    action: () => showDialog('Bandit Leader', 'angry', 'Passing through? I think you\'ll be staying... permanently! Hand over your valuables!', [
                        {
                            text: 'Fight!',
                            action: () => showDialog('Bandit Leader', 'cruel', 'Foolish choice! Boys, get him!', [])
                        },
                        {
                            text: 'Try to negotiate',
                            action: () => showDialog('Bandit Leader', 'neutral', 'Negotiate? Interesting... What could you possibly offer that\'s worth more than your life?', [])
                        }
                    ])
                },
                {
                    text: 'Leave me alone',
                    action: () => showDialog('Bandit Leader', 'cruel', 'Haha! The traveler has spirit! I like that. Very well, you can go... for a price.', [])
                }
            ]);
        }
        
        function testNoblesDialog() {
            updateDebug('Testing nobles dialog...');
            showDialog('Baron Caley', 'neutral', 'Ah, a visitor to my court. What business brings you before Baron Caley of Tournai?', [
                {
                    text: 'I seek your counsel, my lord',
                    action: () => showDialog('Baron Caley', 'happy', 'Counsel? Very well. I am known for my strategic mind. Speak your mind.', [
                        {
                            text: 'What of the coming war?',
                            action: () => showDialog('Baron Caley', 'neutral', 'War is inevitable. The French grow bold, and our king must answer their challenge. Glory awaits those who are brave.', [])
                        },
                        {
                            text: 'I need troops for my campaign',
                            action: () => showDialog('Baron Caley', 'angry', 'You dare ask ME for troops? Prove your worth first, then we shall speak of alliances.', [])
                        }
                    ])
                },
                {
                    text: 'I am just passing through',
                    action: () => showDialog('Count Charles', 'neutral', 'Passing through? These are dangerous times. The roads are not safe for lone travelers.', [])
                },
                {
                    text: 'I bring news from the front',
                    action: () => showDialog('Count Charles', 'neutral', 'News? Speak quickly. Every piece of intelligence matters in these dark times.', [])
                }
            ]);
        }
        
        function testPeasantsDialog() {
            updateDebug('Testing peasants dialog...');
            showDialog('Local Peasant', 'neutral', 'Oh! A noble-born! What brings you to our humble village?', [
                {
                    text: 'I need information about these lands',
                    action: () => showDialog('Local Peasant', 'happy', 'Information? Of course! We know everything that happens here. The forest is dangerous, but the old shrine holds secrets.', [
                        {
                            text: 'Tell me of the forest',
                            action: () => showDialog('Local Peasant', 'worried', 'The forest... many have entered, few have returned. They say strange lights appear at night, and voices call from the trees.', [])
                        },
                        {
                            text: 'What of the old shrine?',
                            action: () => showDialog('Local Peasant', 'scared', 'The shrine! No one goes there anymore. They say the old gods still walk there, and they take those who trespass.', [])
                        }
                    ])
                },
                {
                    text: 'I need supplies',
                    action: () => showDialog('Local Peasant', 'neutral', 'Supplies? We have little, but we share what we can. Times are hard for everyone.', [])
                },
                {
                    text: 'Never mind',
                    action: () => showDialog('Local Peasant', 'sad', 'Of course, my lord. We will not trouble you further.', [])
                }
            ]);
        }
        
        // Initialize
        updateDebug('Mock dialog system initialized');
        updateStatus('Ready to test dialog system');
    </script>
</body>
</html>
