name: Godot Runtime Gate

on:
  pull_request:
  workflow_dispatch:

jobs:
  runtime-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak

      - name: Install Godot (Flatpak)
        run: |
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --noninteractive -y flathub org.godotengine.Godot

      - name: Run runtime release gate
        run: bash godot-project/scripts/run_runtime_release_gate.sh

      - name: Upload runtime gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-runtime-gate
          path: godot-project/artifacts/runtime-gate
          if-no-files-found: error
